{% extends 'learning_logs/base.html' %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividades</title>
</head>
<body>
    
    {% block content %}

    <main>
        <div class="anotacoes">

            {% for entry in entries %}
                <div>
                    <h3>{{ topic }}</h3>
                    <p class="date">{{ entry.date_added | date:"M d, Y H:i" }}</p>
                </div> 
                <p>{{ entry.text | linebreaks }}</p>
            {% empty %}
                <p>Parece que não há anotacoes registradas para esta atividade</p>
            {% endfor %}
        </div>
    </main>

    {% endblock content %}

</body>
</html>
