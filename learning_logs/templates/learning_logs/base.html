<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/learning_logs/static/css/base.css">

    <style>
        :root {
            font-size: 16px;
            --cinza: #F0F0F0;
        }

        * {
            font-size: 1rem;
            font-family: Arial;
            box-sizing: border-box;
        }

        h2 {
            font-size: 2rem;
            margin-bottom: -0.1rem;
        }

        h3 {
            font-size: 1.6rem;
        }

        body {
            background-color:aliceblue;
        }

        header {
            display: flex;
            width: 100%;
            justify-content: space-between;
            border-radius: 1rem;
            position: relative;
            padding: 0.5rem 2rem 0.2rem 2rem;
            top: -1rem;
            background-color: white;
            align-items: center;
            margin-bottom: 3rem;
        }

        header .menu li a, header h1 a {
            text-decoration: none;
            color: black;
        }

        header .menu li a:hover, header h1 a:hover {
            font-size: 1.02rem;
            transition: 0.2s ease-in-out;
        }

        .menu ul {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        main {
            width: 80rem;
            padding: 1rem 2rem;
            margin: 0 auto;
            border-radius: 2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            background-color: white;
        }

        .atividades {
            gap: 1rem;
        }

        .atividades > ul {
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .atividades > ul a {
            display: flex;
            align-items: center;
            list-style: none;
            width: 100%;
            border: 0.05rem solid #F0F0F0;
            border-radius: 0 1rem 1rem 0;
            box-sizing: border-box;
        }

        .atividades > ul a:hover {
            cursor: pointer;
            background-color: #F0F0F0;
        }

        .atividades > ul a li {
            margin-left: 1rem;
        }

        .atividades > ul a {
            text-decoration: none;
            color: black;
        }        

        .atividades > ul a::before{
            content: ' ';
            display: block;
            width: 0.3rem;
            position: relative;
            right: 0.2rem;
            top: 0;
            background-color: crimson;
            height: 3rem;
        }

        .anotacoes div > h3 {
            margin-bottom: 0;
        }

        .anotacoes div > .date {
            font-size: 10px;
            color: grey;
        }

    </style>
</head>
<body>
    <header>
        <h1><a href="{% url 'index' %}">Learning Log</a></h1>
        <nav class="menu">
            <ul>
                <li><a href="{% url 'atividades' %}">Atividades</a></li>
                <li><a href="">Registros</a></li>
                <li><a href="">Perfil</a></li>
            </ul>
        </nav>
    </header>

    {% block content %}

    {% endblock content %}

</body>
</html>
